<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filters and stickers · QuickPic</title>
<link rel="stylesheet" href="quickpic.css">
<style>
  /* kiosk 1920x1080: 35/65 split. Left: the whole strip as it will print. Right: one window at working size. */
  .editor { display: grid; grid-template-columns: minmax(0, 35fr) minmax(0, 65fr); height: 100svh; }
  .preview { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 24px; padding: 40px; background: var(--stage-2); }
  .preview h1 { font-size: clamp(32px, 2.6vw, 52px); line-height: 1; font-weight: 600; letter-spacing: -0.035em; }
  .preview .strip { --w: max(200px, min(15vw, 26vh)); justify-self: center; align-self: center; }
  .preview .strip .warm { filter: sepia(.25) saturate(1.2); }
  .preview .active { outline: 4px solid var(--accent); outline-offset: 2px; }
  .preview .mini-sticker { position: absolute; right: 8%; bottom: 10%; padding: 2px 6px; background: #fff; color: #111; font-size: 11px; font-weight: 600; rotate: -6deg; }
  .preview p { font-size: 17px; color: var(--stage-muted); }

  .work { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 24px; padding: 40px; min-width: 0; }
  .canvas { position: relative; display: grid; place-items: center; min-height: 0; container-type: size; }
  .big { position: relative; width: min(100cqw, 150cqh); aspect-ratio: 3 / 2; }
  .big .img { position: absolute; inset: 0; filter: sepia(.25) saturate(1.2); }

  /* a selected sticker: bounding box, rotation stem, corner scale handles, duplicate and delete */
  .sticker { position: absolute; right: 12%; bottom: 14%; rotate: -6deg; }
  .sticker .label { display: block; padding: 10px 18px; background: #fff; color: #111; font-size: clamp(28px, 2.4vw, 44px); font-weight: 600; letter-spacing: -0.02em; }
  .box { position: absolute; inset: -14px; border: 2px solid var(--accent); pointer-events: none; }
  .box i { position: absolute; width: 16px; height: 16px; background: #fff; border: 2px solid var(--accent); }
  .box i:nth-child(1) { left: -9px; top: -9px; } .box i:nth-child(2) { right: -9px; top: -9px; }
  .box i:nth-child(3) { left: -9px; bottom: -9px; } .box i:nth-child(4) { right: -9px; bottom: -9px; }
  .stem { position: absolute; left: 50%; top: -58px; width: 2px; height: 44px; background: var(--accent); }
  .stem::before { content: ""; position: absolute; left: -11px; top: -22px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
  .sticker-tools { position: absolute; left: 50%; bottom: -78px; translate: -50% 0; rotate: 6deg; display: flex; gap: 8px; }
  .sticker-tools .btn { height: 48px; font-size: 16px; background: #111; border-color: #111; }
  .other { position: absolute; left: 10%; top: 12%; width: 72px; height: 72px; }

  .tabs { display: flex; gap: 8px; }
  .tabs button { height: 52px; padding: 0 22px; border: 1px solid var(--stage-line); border-radius: var(--radius); background: transparent; color: var(--stage-muted); font-size: 18px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--stage-ink); color: #111; border-color: transparent; }
  .tabs { min-width: 0; flex-wrap: wrap; }
  .tabs .count { margin-left: auto; align-self: center; font-size: 17px; color: var(--stage-muted); }

  .tray { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)) auto; min-width: 0; gap: 12px; align-items: end; }
  .filter { display: grid; gap: 8px; padding: 0; border: 0; background: none; color: var(--stage-muted); font-size: 16px; text-align: left; cursor: pointer; }
  .filter .photo { aspect-ratio: 3 / 2; border-radius: 2px; }
  .filter[aria-pressed="true"] { color: var(--stage-ink); }
  .filter[aria-pressed="true"] .photo { outline: 4px solid #fff; outline-offset: -4px; }
  .f-mono .photo { filter: grayscale(1) contrast(1.1); }
  .f-warm .photo { filter: sepia(.25) saturate(1.2); }
  .f-fade .photo { filter: contrast(.8) brightness(1.15); }
  .f-film .photo { filter: sepia(.4) contrast(1.15) saturate(.8); }
  .f-bright .photo { filter: brightness(1.3) saturate(1.1); }
  .tray .print { height: 72px; padding: 0 32px; font-size: 22px; }
  .work > * { min-width: 0; }
  @media (max-width: 1000px) {
    .editor { grid-template-columns: 1fr; height: auto; }
    .preview, .work { padding: 24px; }
    .work .canvas { height: 56vw; }
    .tray { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tray .print { grid-column: 1 / -1; }
    .sticker .label { font-size: 20px; }
  }
</style>
</head>
<body class="stage">
<main class="editor">
  <section class="preview" aria-label="Your strip">
    <h1>Make it yours</h1>
    <div class="strip">
      <div class="photo t1 warm"></div>
      <div class="photo t2 warm active"><svg viewBox="0 0 72 72" style="position:absolute;left:10%;top:12%;width:12%" aria-hidden="true"><path d="M36 4l8.6 20.4L66 26.6 49.8 41.2 54.6 63 36 51.6 17.4 63l4.8-21.8L6 26.6l21.4-2.2z" fill="#f5c542" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg><span class="mini-sticker">#GIWeekend</span></div>
      <div class="photo t3 warm"></div>
      <div class="photo t4 warm"></div>
      <div class="foot">GI Weekend<small>Grand Indonesia, Jakarta</small><small class="num">19.10.26 · #GIWeekend</small></div>
    </div>
    <p>Tap a window on the strip to edit it. Prints exactly as shown.</p>
  </section>

  <section class="work" aria-label="Window 2">
    <div class="canvas" data-ui>
      <div class="big">
        <div class="photo t2 img" role="img" aria-label="Pose 2 with the Warm filter"></div>
        <svg class="other" viewBox="0 0 72 72" aria-label="Star sticker"><path d="M36 4l8.6 20.4L66 26.6 49.8 41.2 54.6 63 36 51.6 17.4 63l4.8-21.8L6 26.6l21.4-2.2z" fill="#f5c542" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>
        <div class="sticker">
          <span class="label">#GIWeekend</span>
          <span class="box" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="stem" aria-hidden="true"></span>
          <div class="sticker-tools"><button class="btn" type="button">Duplicate</button><button class="btn" type="button">Remove</button></div>
        </div>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true">Filters</button>
      <button type="button" role="tab" aria-selected="false">Stickers</button>
      <span class="count num">Window 2 of 4 · 2 stickers</span>
    </div>

    <div class="tray">
      <button class="filter" type="button" aria-pressed="false"><span class="photo t2"></span>Original</button>
      <button class="filter f-mono" type="button" aria-pressed="false"><span class="photo t2"></span>Mono</button>
      <button class="filter f-warm" type="button" aria-pressed="true"><span class="photo t2"></span>Warm</button>
      <button class="filter f-fade" type="button" aria-pressed="false"><span class="photo t2"></span>Faded</button>
      <button class="filter f-film" type="button" aria-pressed="false"><span class="photo t2"></span>Film</button>
      <button class="filter f-bright" type="button" aria-pressed="false"><span class="photo t2"></span>Bright</button>
      <a class="btn primary print" href="09-result.html">Print 2 strips</a>
    </div>
  </section>
</main>
</body>
</html>
