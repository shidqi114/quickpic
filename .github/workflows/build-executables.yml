name: Build & Publish Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Windows Executable (.exe)
        run: npm run electron:dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickpic-windows
          path: dist/*.exe

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build macOS Installer (.dmg)
        run: npm run electron:dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickpic-mac
          path: dist/*.dmg

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Create release directory
        run: mkdir -p release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quickpic-windows
          path: release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quickpic-mac
          path: release-files

      - name: Determine Tag Name
        id: release_info
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.0"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "QuickPic Photobooth ${{ steps.release_info.outputs.tag_name }}"
          body: |
            ## QuickPic Photobooth Desktop
            
            Instant download links for QuickPic desktop app:
            - **Windows**: Download the `.exe` installer below.
            - **macOS**: Download the `.dmg` installer below.
            
            Includes native Canon DSLR direct USB control & DNP dye-sub printer spooling.
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
