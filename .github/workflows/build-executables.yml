name: Build & Publish Desktop Installers

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v0.1.5, leave blank to use package.json version)"
        required: false
        type: string
        default: ""
      draft:
        description: "Publish as Draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Publish as Pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Executable (.exe)
        run: npm run electron:dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickpic-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Installer (.dmg)
        run: npm run electron:dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickpic-mac
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-windows, build-mac]
    if: always() && !cancelled() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Tag Name
        id: release_info
        shell: bash
        run: |
          INPUT_TAG="${{ inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Selected Release Tag: ${TAG}"

      - name: Create Release Directory
        run: mkdir -p release-files

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "quickpic-*"
          path: release-files
          merge-multiple: true

      - name: Inspect Files For Release
        shell: bash
        run: |
          echo "Listing all collected release binaries:"
          ls -la release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "QuickPic Photobooth ${{ steps.release_info.outputs.tag_name }}"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## 📸 QuickPic Photobooth Desktop Release

            Official desktop application release for QuickPic Photobooth:
            - **Windows**: Download the `.exe` installer (NSIS setup) or portable `.exe` below.
            - **macOS**: Download the `.dmg` installer below (if available).

            ### Included Features
            - Native Canon DSLR direct USB tethering & live viewfinder control
            - DNP dye-sublimation printer spooling
            - Auto-reconnect & offline tolerance
          files: release-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
