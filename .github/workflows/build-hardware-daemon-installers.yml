name: Build Hardware Daemon Installers

# Trigger on:
# 1. Manual dispatch (workflow_dispatch)
# 2. Tags starting with "daemon-v" (e.g., daemon-v2.0.0)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g., daemon-v2.0.0)"
        required: false
        type: string
      draft:
        description: "Create as Draft Release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "daemon-v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download NSIS
        run: |
          Invoke-WebRequest -Uri https://sourceforge.net/projects/nsis/files/NSIS%203/3.09/nsis-3.09-setup.exe -OutFile nsis-setup.exe
          .\nsis-setup.exe /S /D=C:\NSIS
        shell: powershell

      - name: Verify NSIS Installation
        run: |
          C:\NSIS\makensis.exe /version
        shell: cmd

      - name: Build Windows Installer
        run: |
          cd hardware-daemon
          C:\NSIS\makensis.exe installer-windows.nsi
        shell: cmd

      - name: List Build Artifacts
        run: |
          dir hardware-daemon\*.exe
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: hardware-daemon/*.exe
          if-no-files-found: error

  build-macos-installer:
    name: Build macOS Installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          brew install create-dmg

      - name: Build macOS DMG
        run: |
          cd hardware-daemon
          chmod +x create-macos-dmg.sh
          ./create-macos-dmg.sh

      - name: Verify Build
        run: |
          ls -lh hardware-daemon/*.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: hardware-daemon/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-windows-installer, build-macos-installer]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="daemon-v$(date +%Y.%m.%d)"
          fi

          # Ensure tag starts with "daemon-v"
          if [[ ! $TAG =~ ^daemon-v ]]; then
            TAG="daemon-v${TAG#v}"
          fi

          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Release Tag: ${TAG}"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List Downloaded Files
        run: |
          find release-artifacts -type f
          ls -lh release-artifacts/*/*

      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          # Copy Windows installer
          if [ -f "release-artifacts/windows-installer"/*.exe ]; then
            cp release-artifacts/windows-installer/*.exe release-files/ || true
          fi
          # Copy macOS installer
          if [ -f "release-artifacts/macos-installer"/*.dmg ]; then
            cp release-artifacts/macos-installer/*.dmg release-files/ || true
          fi

          echo "Release files ready:"
          ls -lh release-files/

      - name: Create GitHub Release
        if: success() && (hashFiles('release-files/*') != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "QuickPic Hardware Daemon ${{ steps.release_info.outputs.tag_name }}"
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          body: |
            ## 📦 QuickPic Hardware Daemon Release

            ### Installation

            **Windows Users:**
            - Download: `QuickPic-Hardware-Daemon-Installer.exe`
            - Double-click to run
            - Follow the setup wizard

            **macOS Users:**
            - Download: `QuickPic-Hardware-Daemon-Installer.dmg`
            - Double-click to open
            - Drag app to Applications folder

            ### What's Included
            ✅ Automatic dependency installation (gphoto2, CUPS, Python packages)
            ✅ Professional GUI installer for easy setup
            ✅ USB device detection and diagnostics
            ✅ Hardware daemon with REST API

            ### Quick Start
            1. Connect Canon camera via USB-C
            2. Connect DNP printer via USB
            3. Launch the Hardware Daemon app
            4. Access API at: http://localhost:8000
            5. Diagnostics at: http://localhost:8000/debug/usb

            ### Release Notes
            See commit history for detailed changes.
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: success()
        run: |
          echo "✅ Release published successfully!"
          echo "Tag: ${{ steps.release_info.outputs.tag_name }}"
          echo "Files published: $(ls -1 release-files/ 2>/dev/null | wc -l)"
